; far2l ~/.config/far2l/settings/user_menu.ini
[UserMenu/MainMenu/Item0]
HotKey=g
Label=Search in !.!
Submenu=0
Command0=grep !?Search for:?! !?In:?*.*!
Command1=far2l -v -

[UserMenu/MainMenu/Item1]
HotKey=--
Label=
Submenu=0

[UserMenu/MainMenu/Item2]
HotKey=F3
Label=Diff same file
Submenu=0
Command0=[ -f !##!/!^!.! ] && diff -c -p !##!/!^!.! !/!.!

[UserMenu/MainMenu/Item3]
HotKey=s
Label=Tools
Submenu=1

[UserMenu/MainMenu/Item3/Item0]
HotKey=l
Label=List files
Submenu=0
Command0=ls -la "!/"
Command1=@cat !@@AFQ!
